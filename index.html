<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Samvidhan Portal: Learn the Indian Constitution</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--s50:#f3faff;--s100:#e2f3ff;--s200:#bfe5fb;--s400:#5bbcf0;--s500:#2fa4e7;--s600:#1f8fd6;--s800:#0f5f94;--ink:#12324a;--mute:#5f7a90;--w:#fff;--ok:#1aa78a;--bad:#e5586f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);color-scheme:light;scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Poppins','Noto Sans Devanagari',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff 0,var(--s50) 60%,var(--s100) 100%);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:60}
button{font-family:inherit;cursor:pointer}
#sp{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:4px;width:0;background:linear-gradient(90deg,var(--s400),var(--s600));z-index:70}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);box-shadow:0 4px 24px #1f8fd61a;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--s800)}
.brand i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--s400),var(--s600));display:grid;place-items:center;font-style:normal;color:#fff}
#nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:4px}
#nav::-webkit-scrollbar{display:none}
.np{border:0;background:none;padding:9px 15px;border-radius:99px;font-weight:600;font-size:.88rem;color:var(--mute);white-space:nowrap;transition:.3s}
.np:hover{background:var(--s100);color:var(--s800)}
.np.on{background:var(--s600);color:#fff;box-shadow:0 6px 16px #1f8fd644}
.lang{border:2px solid var(--s200);background:#fff;color:var(--s600);font-weight:700;padding:8px 14px;border-radius:99px;font-size:.85rem;white-space:nowrap;transition:.25s}
.lang:hover{background:var(--s600);color:#fff;border-color:var(--s600)}
.wrap{max-width:1060px;margin:0 auto;padding:26px 18px 60px}
.view{animation:rise .55s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
h2.t{font-size:clamp(1.6rem,4vw,2.3rem);margin:0 0 6px;font-weight:800;color:var(--s800)}
.lead{color:var(--mute);margin:0 0 24px;max-width:62ch;line-height:1.7}
.hero{position:relative;display:grid;grid-template-columns:1.3fr .7fr;gap:20px;align-items:center;background:linear-gradient(135deg,#fff,var(--s100));border-radius:32px;padding:38px;box-shadow:0 20px 50px #1f8fd622;overflow:hidden}
.hero h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.12;margin:0 0 14px;font-weight:800;color:var(--s800);letter-spacing:-.02em}
.hero p{color:var(--mute);line-height:1.7;margin:0 0 22px;max-width:46ch}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:99px;padding:13px 24px;font-weight:700;font-size:.95rem;background:linear-gradient(135deg,var(--s400),var(--s600));color:#fff;box-shadow:0 10px 24px #1f8fd64d;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 30px #1f8fd666}
.btn.o{background:#fff;color:var(--s600);box-shadow:inset 0 0 0 2px var(--s200)}
.floaty{position:relative;height:210px}
.floaty span{position:absolute;display:grid;place-items:center;min-width:64px;height:64px;padding:0 14px;border-radius:20px;background:#fff;color:var(--s600);font-weight:800;font-size:1.2rem;box-shadow:0 12px 28px #1f8fd633;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-16px) rotate(3deg)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:22px 0}
.stat{background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 28px #1f8fd61c;text-align:center}
.stat b{display:block;font-size:2rem;color:var(--s600)}.stat span{font-size:.82rem;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.box{background:#fff;border-radius:26px;padding:24px;box-shadow:0 12px 32px #1f8fd61c}
.box h3{margin:0 0 10px;color:var(--s800);font-size:1.05rem}
.ring{display:flex;align-items:center;gap:18px}
.ring svg{flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .fg{stroke:var(--s500);stroke-dasharray:289;transition:stroke-dashoffset 1.4s cubic-bezier(.3,1,.4,1) .2s}
.ring .tr{stroke:var(--s100)}
.ring b{font-size:1.6rem;color:var(--s600)}
.dyk{min-height:92px;line-height:1.7;color:var(--ink);transition:opacity .4s}
.dots{display:flex;gap:6px;margin-top:10px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--s200);transition:.3s}.dots i.on{width:24px;border-radius:9px;background:var(--s500)}
.search{position:relative;max-width:560px;margin:0 0 14px}
.search input{width:100%;border:2px solid var(--s200);background:#fff;padding:14px 18px 14px 48px;border-radius:99px;font:500 1rem inherit;font-family:inherit;color:var(--ink);outline:none;transition:.3s}
.search input:focus{border-color:var(--s500);box-shadow:0 0 0 6px #5bbcf033}
.search span{position:absolute;left:18px;top:50%;transform:translateY(-50%)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:0;background:#fff;padding:8px 15px;border-radius:99px;font-weight:600;font-size:.82rem;color:var(--mute);box-shadow:inset 0 0 0 2px var(--s100);transition:.25s}
.chip:hover{box-shadow:inset 0 0 0 2px var(--s400);color:var(--s600)}
.chip.on{background:var(--s600);color:#fff;box-shadow:0 6px 14px #1f8fd644}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{position:relative;background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 30px #1f8fd61a;cursor:pointer;overflow:hidden;animation:pop .5s backwards;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 22px 44px #1f8fd633}
.card.read::before{content:"✓";position:absolute;top:0;right:0;background:var(--ok);color:#fff;padding:3px 16px 3px 20px;border-radius:0 0 0 18px;font-size:.8rem;font-weight:700}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(20px)}}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.no{flex:none;min-width:56px;text-align:center;padding:8px 10px;border-radius:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--s400),var(--s600));font-size:.9rem}
.card h3{margin:0;font-size:1.02rem;line-height:1.3}
.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--s100);color:var(--s600);margin-bottom:8px}
.card p{margin:0;color:var(--mute);font-size:.92rem;line-height:1.7}
.more{max-height:0;opacity:0;overflow:hidden;transition:.45s;background:var(--s50);border-radius:14px;padding:0 14px;font-size:.86rem;line-height:1.6}
.card.open .more{max-height:260px;opacity:1;margin-top:12px;padding:12px 14px}
.acts{display:flex;gap:8px;margin-top:10px}
.mini{border:0;background:var(--s100);color:var(--s600);font-weight:600;font-size:.78rem;padding:6px 12px;border-radius:99px;transition:.2s}
.mini:hover{background:var(--s600);color:#fff}.mini.on{background:var(--s600);color:#fff}
.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--mute);font-weight:600}
.pre{background:#fff;border-radius:28px;padding:30px;box-shadow:0 14px 40px #1f8fd62a;line-height:2;font-size:1.05rem;margin-bottom:16px}
.pre.h{font-size:1.1rem}
.kw{border:0;background:var(--s100);color:var(--s800);font:inherit;font-weight:700;padding:0 8px;border-radius:8px;transition:.2s}
.kw:hover,.kw.on{background:var(--s600);color:#fff}
#kwp{background:linear-gradient(135deg,var(--s600),var(--s400));color:#fff;border-radius:20px;padding:18px 22px;line-height:1.6;animation:rise .4s}
.tl{position:relative;margin-left:14px;padding-left:28px;border-left:3px solid var(--s200)}
.ti{position:relative;background:#fff;border-radius:20px;padding:18px 20px;margin-bottom:18px;box-shadow:0 8px 24px #1f8fd61a;opacity:0;transform:translateX(-24px);transition:.6s}
.ti.in{opacity:1;transform:none}
.ti::before{content:"";position:absolute;left:-39px;top:22px;width:16px;height:16px;border-radius:50%;background:var(--s500);box-shadow:0 0 0 5px var(--s100)}
.ti b{color:var(--s600);font-size:.85rem}.ti h3{margin:2px 0 6px;font-size:1.05rem}.ti p{margin:0;color:var(--mute);font-size:.92rem;line-height:1.6}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tile{background:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 28px #1f8fd61a;transition:.3s;animation:pop .5s backwards}
.tile:hover{transform:translateY(-5px)}
.tile .em{font-size:2rem}.tile h3{margin:6px 0;font-size:1rem;color:var(--s800)}.tile p{margin:0;color:var(--mute);font-size:.9rem;line-height:1.65}
.tile .yr{display:inline-block;background:var(--s600);color:#fff;font-weight:700;font-size:.78rem;padding:3px 12px;border-radius:99px}
.fc{perspective:1000px;max-width:520px;margin:0 auto 18px;height:280px;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.2,.4,1);transform-style:preserve-3d}
.fc.f .fi{transform:rotateY(180deg)}
.fs{position:absolute;inset:0;backface-visibility:hidden;border-radius:28px;padding:28px;display:grid;place-items:center;text-align:center;box-shadow:0 20px 50px #1f8fd633;font-size:1.15rem;line-height:1.6}
.fs.a{background:#fff;font-size:1.8rem;font-weight:800;color:var(--s800)}
.fs.b{background:linear-gradient(135deg,var(--s600),var(--s400));color:#fff;transform:rotateY(180deg)}
.ctl{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.quiz{max-width:660px;margin:0 auto;background:#fff;border-radius:32px;padding:30px;box-shadow:0 24px 60px #1f8fd633;position:relative;overflow:hidden}
.quiz.shake{animation:shake .5s}.quiz.glow{animation:glow .8s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
@keyframes glow{40%{box-shadow:0 0 0 10px #1aa78a33,0 24px 60px #1aa78a55;transform:scale(1.02)}}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;font-weight:600;color:var(--mute);margin-bottom:10px}
.pill{background:var(--s100);color:var(--s600);padding:4px 12px;border-radius:99px}
.pill.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.4)}}
.bar{height:9px;border-radius:9px;background:var(--s100);overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--s400),var(--s600));transition:width .6s}
.bar.tm i{transition:width .1s linear;background:linear-gradient(90deg,var(--s200),var(--s500))}
.q{font-size:1.3rem;line-height:1.45;font-weight:700;margin:18px 0}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid var(--s100);background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:11px;font:600 1rem inherit;font-family:inherit;color:var(--ink);transition:transform .25s,border-color .25s,background .25s;animation:slide .45s backwards}
@keyframes slide{from{opacity:0;transform:translateX(-24px)}}
.opt b{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--s100);color:var(--s600);font-size:.85rem}
.opt:not(:disabled):hover{transform:translateX(8px);border-color:var(--s400);background:var(--s50)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:#e8faf5;animation:hop .6s}.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fff1f3;animation:shake .5s}.opt.wrong b{background:var(--bad);color:#fff}
.opt.dim{opacity:.4}
@keyframes hop{30%{transform:scale(1.04) translateY(-6px)}}
.fb{display:none;margin-top:4px;padding:14px 16px;border-radius:16px;font-size:.9rem;line-height:1.6}
.fb.show{display:block;animation:rise .4s}.fb.ok{background:#e8faf5;color:#0e6e5b}.fb.no{background:#fff1f3;color:#a02a40}
.fb strong{display:block;font-size:1.02rem}
.row{display:flex;gap:10px;margin-top:14px}.row .btn{flex:1}
.res{text-align:center}
.big{position:relative;width:170px;height:170px;margin:8px auto}
.big svg{transform:rotate(-90deg)}.big circle{fill:none;stroke-width:14;stroke-linecap:round}
.big .tr{stroke:var(--s100)}.big .fg{stroke:var(--s500);stroke-dasharray:440;stroke-dashoffset:440;transition:stroke-dashoffset 1.6s cubic-bezier(.3,1,.4,1) .2s}
.big span{position:absolute;inset:0;display:grid;place-items:center;font-size:2.3rem;font-weight:800;color:var(--s600)}
.rv{text-align:left;margin-top:16px;background:var(--s50);border-radius:18px;padding:14px 16px;font-size:.88rem;line-height:1.6}
.rv div{padding:6px 0;border-bottom:1px solid var(--s100)}.rv div:last-child{border:0}
.pts{position:fixed;z-index:80;font-weight:800;color:var(--s600);font-size:1.3rem;pointer-events:none;animation:up 1.1s forwards;text-shadow:0 2px 10px #fff}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--s800);color:#fff;padding:12px 22px;border-radius:99px;font-weight:600;font-size:.9rem;z-index:95;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
#toast.on{transform:translate(-50%,0)}
#top{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:0;background:var(--s600);color:#fff;font-size:1.2rem;box-shadow:0 10px 24px #1f8fd666;opacity:0;pointer-events:none;transition:.3s;z-index:55}
#top.on{opacity:1;pointer-events:auto}
footer{text-align:center;color:var(--mute);font-size:.82rem;padding:20px 16px 40px}
footer button{border:0;background:none;color:var(--s600);font-weight:600;text-decoration:underline}
@media(max-width:760px){.hero,.two{grid-template-columns:1fr}.floaty{height:130px}.hero{padding:26px}.brand span{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
:focus-visible{outline:3px solid var(--s400);outline-offset:3px}
#nav{position:relative}
.sec{max-width:1060px;margin:0 auto;padding:60px 18px 28px;transition:opacity .8s,transform .8s}
.sec.alt{background:var(--s50);box-shadow:0 0 0 100vmax var(--s50);clip-path:inset(0 -100vmax)}
.sec.rvh{opacity:0;transform:translateY(40px)}
#sec-home{padding-top:30px}#sec-quiz{min-height:660px}
.kick{display:inline-block;background:var(--s600);color:#fff;font-weight:700;font-size:.78rem;padding:5px 14px;border-radius:99px;margin-bottom:12px;letter-spacing:.04em}
.tile .em.n{font-size:1.5rem;font-weight:800;color:var(--s600)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:34px 24px;margin-top:26px}
.step{position:relative;background:#fff;border-radius:24px;padding:30px 20px 20px;box-shadow:0 12px 32px #1f8fd62a;animation:pop .6s backwards;transition:.3s}
.step:hover{transform:translateY(-8px)}
.step .sn{position:absolute;top:-18px;left:18px;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--s400),var(--s600));color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 8px 18px #1f8fd666}
.step .se{font-size:2rem}.step h3{margin:6px 0;color:var(--s800);font-size:1.02rem}.step p{margin:0 0 12px;color:var(--mute);font-size:.9rem;line-height:1.6}
.arch{max-width:720px;margin:0 auto}
.layer{display:flex;gap:16px;align-items:center;background:#fff;border-radius:22px;padding:18px 22px;box-shadow:0 10px 28px #1f8fd62a;border-left:6px solid var(--s500);transition:.3s}
.layer:hover{transform:scale(1.02)}.layer>b{font-size:2rem}.layer h3{margin:0 0 4px;color:var(--s800);font-size:1.05rem}.layer p{margin:0;color:var(--mute);font-size:.9rem;line-height:1.55}
.flow{text-align:center;color:var(--s600);font-weight:600;font-size:.85rem;padding:10px 0;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.cta2{text-align:center;max-width:760px;margin:0 auto}.cta2 h2{font-size:clamp(1.8rem,5vw,3rem);margin:8px 0;color:var(--s800)}.cta2 p{color:var(--mute);line-height:1.8}
.demo{margin-top:30px;text-align:center;font-weight:700;color:var(--s600)}
</style>
</head>
<body>
<div id="sp"></div><canvas id="fx"></canvas><div id="toast"></div>
<header><div class="brand"><i>📘</i><span id="brand"></span></div><nav id="nav"></nav><button class="lang" id="lang"></button></header>
<main id="page"></main>
<footer><div id="foot"></div><button id="reset"></button></footer>
<button id="top" aria-label="Back to top">↑</button>
<script>
const A=[
{i:"14",c:"eq",t:["Right to Equality","समानता का अधिकार"],d:["The State shall not deny to any person equality before the law or the equal protection of the laws within the territory of India.","राज्य भारत के राज्यक्षेत्र में किसी व्यक्ति को विधि के समक्ष समता से या विधियों के समान संरक्षण से वंचित नहीं करेगा।"],k:["Everyone, from a minister to a shopkeeper, is under the same law.","मंत्री हो या दुकानदार, सब पर एक ही कानून लागू होता है।"]},
{i:"15",c:"eq",t:["No Discrimination","भेदभाव का निषेध"],d:["The State shall not discriminate against any citizen on grounds only of religion, race, caste, sex or place of birth.","राज्य किसी नागरिक के विरुद्ध केवल धर्म, मूलवंश, जाति, लिंग या जन्मस्थान के आधार पर भेदभाव नहीं करेगा।"],k:["Shops, wells, roads and other public places must be open to all.","दुकानें, कुएँ, सड़कें और सार्वजनिक स्थान सबके लिए खुले होने चाहिए।"]},
{i:"17",c:"eq",t:["Abolition of Untouchability","अस्पृश्यता का अंत"],d:["Untouchability is abolished and its practice in any form is forbidden.","अस्पृश्यता का अंत किया जाता है और किसी भी रूप में उसका आचरण निषिद्ध है।"],k:["Enforcing any disability on this ground is a punishable offence.","इस आधार पर किसी निर्योग्यता को लागू करना दंडनीय अपराध है।"]},
{i:"19",c:"fr",t:["Freedom of Speech and more","वाक्-स्वातंत्र्य आदि"],d:["All citizens have the right to freedom of speech and expression, to assemble peacefully, to form associations and to move freely.","सभी नागरिकों को वाक्-स्वातंत्र्य और अभिव्यक्ति-स्वातंत्र्य, शांतिपूर्वक एकत्र होने, संघ बनाने और स्वतंत्र रूप से घूमने का अधिकार है।"],k:["The State may impose reasonable restrictions, for example for public order.","राज्य लोक-व्यवस्था जैसे आधारों पर उचित प्रतिबंध लगा सकता है।"]},
{i:"21",c:"fr",t:["Protection of Life and Liberty","प्राण और दैहिक स्वतंत्रता"],d:["No person shall be deprived of his life or personal liberty except according to procedure established by law.","किसी व्यक्ति को उसके प्राण या दैहिक स्वतंत्रता से विधि द्वारा स्थापित प्रक्रिया के अनुसार ही वंचित किया जाएगा।"],k:["Courts have read privacy, clean air and dignity into this Article.","न्यायालयों ने निजता, स्वच्छ वायु और गरिमा को इसका हिस्सा माना है।"]},
{i:"21A",c:"fr",t:["Right to Education","शिक्षा का अधिकार"],d:["The State shall provide free and compulsory education to all children aged six to fourteen years.","राज्य छह से चौदह वर्ष की आयु के सभी बच्चों को निःशुल्क और अनिवार्य शिक्षा प्रदान करेगा।"],k:["Added by the 86th Amendment in 2002.","यह 2002 में 86वें संशोधन द्वारा जोड़ा गया।"]},
{i:"23",c:"ex",t:["No Trafficking or Forced Labour","दुर्व्यापार और बलात्श्रम निषेध"],d:["Trafficking in human beings and forced labour are prohibited.","मनुष्यों के दुर्व्यापार और बलात्श्रम का प्रतिषेध किया जाता है।"],k:["This Article protects citizens and non-citizens alike.","यह अनुच्छेद नागरिकों और गैर-नागरिकों दोनों की रक्षा करता है।"]},
{i:"24",c:"ex",t:["No Child Labour in Hazardous Work","बच्चों से जोखिम भरा काम नहीं"],d:["No child below fourteen years shall be employed in a factory, mine or other hazardous work.","चौदह वर्ष से कम आयु के किसी बच्चे को कारखाने, खान या अन्य जोखिम भरे काम में नियोजित नहीं किया जाएगा।"],k:["Childhood is for school and play, not work.","बचपन स्कूल और खेल के लिए है, काम के लिए नहीं।"]},
{i:"25",c:"rl",t:["Freedom of Religion","धर्म की स्वतंत्रता"],d:["All persons are equally entitled to freedom of conscience and the right to freely profess, practise and propagate religion.","सभी व्यक्तियों को अंतःकरण की स्वतंत्रता और धर्म को अबाध रूप से मानने, आचरण करने और प्रचार करने का समान अधिकार है।"],k:["It is the backbone of India’s secular character.","यह भारत के पंथनिरपेक्ष स्वरूप की रीढ़ है।"]},
{i:"29",c:"cu",t:["Protection of Minorities’ Culture","अल्पसंख्यकों की संस्कृति का संरक्षण"],d:["Any section of citizens with a distinct language, script or culture has the right to conserve it.","विशिष्ट भाषा, लिपि या संस्कृति वाले नागरिकों के किसी भी वर्ग को उसे बनाए रखने का अधिकार है।"],k:["Article 30 adds the right of minorities to run their own educational institutions.","अनुच्छेद 30 अल्पसंख्यकों को अपनी शिक्षा संस्थाएँ चलाने का अधिकार देता है।"]},
{i:"32",c:"rm",t:["Constitutional Remedies","संवैधानिक उपचारों का अधिकार"],d:["The right to move the Supreme Court to enforce the Fundamental Rights.","मौलिक अधिकारों के प्रवर्तन के लिए सर्वोच्च न्यायालय में जाने का अधिकार।"],k:["Dr. Ambedkar called it the heart and soul of the Constitution.","डॉ. आंबेडकर ने इसे संविधान की आत्मा और हृदय कहा था।"]},
{i:"51A",c:"du",t:["Fundamental Duties","मूल कर्तव्य"],d:["It shall be the duty of every citizen of India to abide by the Constitution and respect its ideals and institutions.","भारत के प्रत्येक नागरिक का कर्तव्य होगा कि वह संविधान का पालन करे और उसके आदर्शों व संस्थाओं का आदर करे।"],k:["Added by the 42nd Amendment in 1976. Rights and duties go hand in hand.","42वें संशोधन (1976) द्वारा जोड़ा गया। अधिकार और कर्तव्य साथ-साथ चलते हैं।"]}];

const G=[["Sovereign","संप्रभु","India takes its own decisions, free from outside control.","भारत अपने निर्णय स्वयं लेता है, किसी बाहरी नियंत्रण से मुक्त।"],["Socialist","समाजवादी","The State works to reduce inequality and share wealth fairly.","राज्य असमानता घटाने और संपत्ति के न्यायसंगत वितरण के लिए काम करता है।"],["Secular","पंथनिरपेक्ष","The State has no official religion and treats all faiths equally.","राज्य का कोई राजकीय धर्म नहीं और वह सभी धर्मों से समान व्यवहार करता है।"],["Democratic","लोकतंत्रात्मक","Power rests with the people, who choose their government by voting.","सत्ता जनता में निहित है, जो मतदान से अपनी सरकार चुनती है।"],["Republic","गणराज्य","The head of State is elected, not a hereditary monarch.","राज्य का प्रमुख निर्वाचित होता है, वंशानुगत राजा नहीं।"],["Justice","न्याय","Fairness in social, economic and political life.","सामाजिक, आर्थिक और राजनैतिक जीवन में निष्पक्षता।"],["Liberty","स्वतंत्रता","Freedom of thought, expression, belief, faith and worship.","विचार, अभिव्यक्ति, विश्वास, धर्म और उपासना की आज़ादी।"],["Equality","समता","Equal status and equal opportunity for everyone.","सबके लिए समान प्रतिष्ठा और समान अवसर।"],["Fraternity","बंधुता","A shared feeling of brotherhood that protects dignity and national unity.","भाईचारे की साझा भावना, जो गरिमा और राष्ट्रीय एकता की रक्षा करती है।"],["Writ","रिट","A court order to enforce a right, such as habeas corpus or mandamus.","अधिकार लागू करने का न्यायालय का आदेश, जैसे बंदी प्रत्यक्षीकरण या परमादेश।"],["Habeas corpus","बंदी प्रत्यक्षीकरण","A writ asking the State to produce a detained person before a court.","वह रिट जिसमें हिरासत में लिए गए व्यक्ति को न्यायालय के सामने पेश करने को कहा जाता है।"],["Judicial review","न्यायिक पुनर्विलोकन","The power of courts to strike down laws that violate the Constitution.","संविधान का उल्लंघन करने वाले कानूनों को रद्द करने की न्यायालयों की शक्ति।"],["Amendment","संशोधन","A formal change to the Constitution under Article 368.","अनुच्छेद 368 के अंतर्गत संविधान में औपच function fc(){const c=fl.d[fl.i];$("#main").innerHTML=`<div class="view"><h2 class="t">${lang?"फ्लैशकार्ड":"Flashcards"}</h2><p class="lead">${lang?"कार्ड पलटने के लिए टैप करें। तीर कुंजियाँ और स्पेस भी काम करते हैं।":"Tap to flip. Arrow keys and Space work too."}</p><div class="fc ${fl.f?"f":""}" id="fcd"><div class="fi"><div class="fs a">${c[0]}</div><div class="fs b">${c[1]}</div></div></div><div class="ctl"><button class="btn o" data-f="p">←</button><span class="pill">${fl.i+1} / ${fl.d.length}</span><button class="btn o" data-f="n">→</button><button class="btn" data-f="s">🔀 ${lang?"मिलाएँ":"Shuffle"}</button></div></div>`}
function fmove(d){fl.i=(fl.i+d+fl.d.length)%fl.d.length;fl.f=0;fc()}

function quiz(){qz={ph:"intro"};$("#main").innerHTML=`<div class="view quiz res"><div style="font-size:3rem">🧠</div><h2 class="t">${lang?"समयबद्ध प्रश्नोत्तरी":"Timed Quiz"}</h2><p class="lead" style="margin:0 auto 16px">${lang?"8 प्रश्न, हर प्रश्न के लिए 20 सेकंड। जल्दी सही उत्तर दें तो ज़्यादा अंक। एक 50:50 लाइफलाइन मिलेगी। कुंजियाँ 1 से 4 भी चलेंगी।":"8 questions, 20 seconds each. Answer fast for bonus points. You get one 50:50 lifeline. Keys 1 to 4 work too."}</p><p><span class="pill">🏅 ${lang?"सर्वश्रेष्ठ":"Best"}: ${S.best}</span></p><button class="btn" id="qs">${lang?"शुरू करें":"Start quiz"}</button></div>`}
function qstart(){qz={ph:"q",i:0,sc:0,st:0,ok:0,ord:shuf([...Q.keys()]).slice(0,8),half:1,wr:[]};qshow()}
function qshow(){clearInterval(timer);if(qz.i>=qz.ord.length)return qres();const k=Q[qz.ord[qz.i]];qz.ans=0;qz.t=200;
$("#main").innerHTML=`<div class="view quiz" id="box"><div class="meta"><span>${lang?"प्रश्न":"Question"} ${qz.i+1}/${qz.ord.length}</span><span class="pill" id="pt">⭐ ${qz.sc}</span><span class="pill" id="st">🔥 ${qz.st}</span></div><div class="bar"><i id="pb" style="width:${qz.i/qz.ord.length*100}%"></i></div><div class="bar tm"><i id="tb" style="width:100%"></i></div><h2 class="q">${p(k.q)}</h2><div id="os">${k.o.map((o,i)=>`<button class="opt" data-i="${i}" style="animation-delay:${i*70}ms"><b>${i+1}</b>${o2(o)}</button>`).join("")}</div><div class="fb" id="fb"></div><div class="row"><button class="btn o" id="ff" ${qz.half?"":"disabled"}>50:50</button><button class="btn" id="nx" style="display:none"></button></div></div>`;
requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$("#pb");if(b)b.style.width=((qz.i+.001)/qz.ord.length*100)+"%"}));
timer=setInterval(()=>{qz.t--;const b=$("#tb");if(b)b.style.width=(qz.t/2)+"%";if(qz.t<=0){clearInterval(timer);pick(-1)}},100)}
function pick(i,btn){if(qz.ans)return;qz.ans=1;clearInterval(timer);const k=Q[qz.ord[qz.i]],ok=i==k.a,os=[...document.querySelectorAll(".opt")],box=$("#box"),fb=$("#fb");
os.forEach((e,j)=>{e.disabled=1;e.classList.add(j==k.a?"right":j==i?"wrong":"dim")});$("#ff").disabled=1;
if(ok){const pt=10+Math.ceil(qz.t/20);qz.sc+=pt;qz.st++;qz.ok++;box.classList.add("glow");$("#st").classList.add("bump");
const r=(btn||os[i]).getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,100);const e=document.createElement("div");e.className="pts";e.textContent="+"+pt;e.style.left=r.left+r.width/2-20+"px";e.style.top=r.top+"px";document.body.appendChild(e);setTimeout(()=>e.remove(),1100);
fb.className="fb show ok";fb.innerHTML=`<strong>✅ ${lang?["सही उत्तर!","शानदार!","बिल्कुल सही!","आप कमाल हैं!"][(qz.st-1)%4]:["Correct!","Brilliant!","Spot on!","You’re on fire!"][(qz.st-1)%4]} +${pt}</strong>${p(k.x)}`}
else{qz.st=0;qz.wr.push(qz.ord[qz.i]);box.classList.add("shake");fb.className="fb show no";fb.innerHTML=`<strong>${i<0?"⏰ "+(lang?"समय समाप्त":"Time’s up"):"❌ "+(lang?"सही नहीं":"Not quite")}</strong>${p(k.x)}`}
$("#pt").textContent="⭐ "+qz.sc;$("#st").textContent="🔥 "+qz.st;const n=$("#nx");n.style.display="block";n.textContent=(qz.i+1<qz.ord.length?(lang?"अगला प्रश्न":"Next question"):(lang?"मेरा स्कोर देखें":"See my score"))+" →";$("#pb").style.width=((qz.i+1)/qz.ord.length*100)+"%"}
function qres(){qz.ph="done";const pc=qz.ok/qz.ord.length,nb=qz.sc>S.best;if(nb){S.best=qz.sc;save()}
$("#main").innerHTML=`<div class="view quiz res"><div style="font-size:3rem">${pc==1?"🏆":pc>=.6?"🌟":"📚"}</div><h2 class="t">${lang?"प्रश्नोत्तरी पूरी!":"Quiz complete!"}</h2><div class="big"><svg viewBox="0 0 160 160" width="170" height="170"><circle class="tr" cx="80" cy="80" r="70"/><circle class="fg" id="fg" cx="80" cy="80" r="70"/></svg><span>${qz.ok}/${qz.ord.length}</span></div><p><span class="pill">⭐ ${qz.sc} ${lang?"अंक":"points"}</span> ${nb?`<span class="pill">🎉 ${lang?"नया सर्वश्रेष्ठ!":"New best!"}</span>`:""}</p>${qz.wr.length?`<div class="rv"><b>${lang?"दोबारा देखें":"Review"}</b>${qz.wr.map(w=>`<div>${p(Q[w].q)}<br><span style="color:var(--s600)">${o2(Q[w].o[Q[w].a])}</span> · ${p(Q[w].x)}</div>`).join("")}</div>`:""}<div class="row"><button class="btn" id="qs">${lang?"फिर से खेलें":"Play again"} 🔄</button></div></div>`;
requestAnimationFrame(()=>requestAnimationFrame(()=>{$("#fg").style.strokeDashoffset=440*(1-pc)}));if(pc>=.6)burst(innerWidth/2,innerHeight/3,pc==1?240:130)}

const cv=$("#fx"),cx=cv.getContext("2d");let P=[],raf=0;
function sz(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}sz();addEventListener("resize",sz);
function burst(x,y,n){const col=["#5bbcf0","#2fa4e7","#1f8fd6","#bfe5fb","#0f5f94","#fff"];for(let i=0;i<n;i++){const a=Math.random()*6.28,v=4+Math.random()*9;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,w:6+Math.random()*7,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:col[i%6],l:1})}if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,innerWidth,innerHeight);P=P.filter(a=>a.l>0&&a.y<innerHeight+30);P.forEach(a=>{a.vy+=.28;a.vx*=.985;a.x+=a.vx;a.y+=a.vy;a.r+=a.vr;a.l-=.009;cx.save();cx.globalAlpha=Math.max(a.l,0);cx.translate(a.x,a.y);cx.rotate(a.r);cx.fillStyle=a.c;cx.strokeStyle="#5bbcf0";cx.fillRect(-a.w/2,-a.h/2,a.w,a.h);cx.strokeRect(-a.w/2,-a.h/2,a.w,a.h);cx.restore()});raf=P.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight)}

const R={home,about,problem,objectives,tech,arch,working,learn,pre,time,amend,borrow,people,gloss,flash,quiz,adv,future,concl};
document.addEventListener("click",e=>{const t=e.target;let b;const sc=t.closest("section[data-s]");if(sc)cur=sc.dataset.s;
if(b=t.closest("[data-v]"))return go(b.dataset.v);
if(b=t.closest("[data-go]"))return go(b.dataset.go);
if(b=t.closest("[data-c]")){cat=b.dataset.c;return learn()}
if(b=t.closest("[data-a]")){const id=t.closest(".card").dataset.i,k=b.dataset.a=="bm"?"bm":"read",a=S[k],j=a.indexOf(id);j<0?a.push(id):a.splice(j,1);save();toast(k=="bm"?(j<0?(lang?"सहेजा गया ★":"Saved ★"):(lang?"हटाया गया":"Removed")):(j<0?(lang?"पढ़ा हुआ चिह्नित ✓ "+S.read.length+"/"+A.length:"Marked as read ✓ "+S.read.length+"/"+A.length):(lang?"अपठित चिह्नित":"Marked unread")));return cards()}
if(b=t.closest(".card"))return b.classList.toggle("open");
if(b=t.closest(".kw")){document.querySelectorAll(".kw").forEach(k=>k.classList.toggle("on",k.dataset.g==b.dataset.g));const g=G.find(x=>x[0]==b.dataset.g);$("#kwp").innerHTML=`<b>${lang?g[1]:g[0]}</b> · ${lang?g[0]:g[1]}<br>${lang?g[3]:g[2]}`;return}
if(b=t.closest(".opt"))return pick(+b.dataset.i,b);
if(t.closest("#ff")&&qz.half&&!qz.ans){qz.half=0;const k=Q[qz.ord[qz.i]];shuf([0,1,2,3].filter(i=>i!=k.a)).slice(0,2).forEach(i=>{const o=document.querySelectorAll(".opt")[i];o.disabled=1;o.classList.add("dim")});$("#ff").disabled=1;return toast("50:50!")}
if(t.closest("#nx")){qz.i++;return qshow()}
if(t.closest("#qs"))return qstart();
if(t.closest("#fcd")){fl.f=!fl.f;return $("#fcd").classList.toggle("f")}
if(b=t.closest("[data-f]")){const d=b.dataset.f;return d=="s"?flash():fmove(d=="n"?1:-1)}
if(t.closest("#reset")){if(confirm(lang?"सारी प्रगति मिट जाएगी। जारी रखें?":"This clears your progress and best score. Continue?")){S={read:[],bm:[],best:0,lang};save();toast(lang?"प्रगति मिटाई गई":"Progress reset");all()}return}
if(t.closest("#top"))scrollTo({top:0})});
document.addEventListener("input",e=>{if(e.target.id=="q"){q=e.target.value;cards()}if(e.target.id=="gq"){gq=e.target.value;gl()}});
document.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;cur=view;
if(view=="quiz"&&qz.ph=="q"){if(!qz.ans&&/^[1-4]$/.test(e.key)){const b=document.querySelectorAll(".opt")[+e.key-1];if(b&&!b.disabled)pick(+e.key-1,b)}else if(qz.ans&&(e.key=="Enter"||e.key==" ")){e.preventDefault();qz.i++;qshow()}}
if(view=="flash"){if(e.key=="ArrowRight")fmove(1);if(e.key=="ArrowLeft")fmove(-1);if(e.key==" "){e.preventDefault();fl.f=!fl.f;$("#fcd").classList.toggle("f")}}});
$("#lang").onclick=()=>{lang=lang?0:1;save();all()};
addEventListener("scroll",()=>{const h=document.documentElement.scrollHeight-innerHeight;$("#sp").style.width=(h>0?scrollY/h*100:0)+"%";$("#top").classList.toggle("on",scrollY>500)},{passive:true});
all();
</script>
</body>
</html>
